name: Build macOS App

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
        branches:
            - main

permissions:
    contents: write

jobs:
    build-mac:
        runs-on: macos-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Версия pnpm берётся из поля packageManager в package.json
            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Версия приложения и имена файлов — из тега: v1.1.3 → 1.1.3 (только внутри сборки, в репозиторий не коммитится)
            - name: Set version from tag
              if: startsWith(github.ref, 'refs/tags/v')
              run: npm pkg set version="${GITHUB_REF_NAME#v}"

            - name: Build application
              run: pnpm build:mac
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Без сертификата Apple Developer: не искать его в связке ключей, подпись делает builder/after-pack.js
                  CSC_IDENTITY_AUTO_DISCOVERY: false

            - name: Upload DMG artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos-dmg-installers
                  path: |
                      release/*.dmg
                      release/*.dmg.blockmap
                  retention-days: 30

            - name: Create Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  files: release/*.dmg
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload build logs (on failure)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: build-logs
                  path: |
                      release/builder-debug.yml
                      release/builder-effective-config.yaml
                  retention-days: 7
